<!-- 
        Nagłówek <h1> z przypisanym zdarzeniem onclick.
        Po kliknięciu w nagłówek, jego zawartość zostanie od razu zmieniona na "nowy tekst".
        Tutaj używamy 'this', aby odwołać się bezpośrednio do klikniętego elementu.
    -->

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 onclick="this.innerHTML='nowy tekst'"> Kliknij w tekst</h1>
</body>
</html>
